<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Modèle de contenu, items et permalien</title>
  <desc>Un modèle de contenu « service » définit une structure. Ses items (ex. « Audit énergétique ») sont rendus soit par une page liste via getContentModelItems, soit individuellement par une page détail reliée via un permalien qui associe le modèle de contenu à sa page de détail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; }
    .title { font-size: 14px; font-weight: 500; }
    .subtitle { font-size: 12px; font-weight: 400; }
  </style>

  <!-- Arrows -->
  <line x1="340" y1="84" x2="340" y2="122" stroke="rgba(80,80,80,0.35)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M340 188 Q260 230 180 266" fill="none" stroke="rgba(80,80,80,0.35)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M340 188 Q420 230 500 266" fill="none" stroke="rgba(80,80,80,0.35)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="500" y1="338" x2="500" y2="374" stroke="rgba(80,80,80,0.35)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Box A: Content model -->
  <rect x="200" y="20" width="280" height="64" rx="6" fill="rgb(219,234,254)" stroke="rgb(59,130,246)" stroke-width="0.5"/>
  <text x="340" y="44" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(29,78,216)">Modèle de contenu</text>
  <text x="340" y="64" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(59,130,246)">service</text>

  <!-- Box B: Item -->
  <rect x="200" y="124" width="280" height="64" rx="6" fill="rgb(209,250,229)" stroke="rgb(16,185,129)" stroke-width="0.5"/>
  <text x="340" y="148" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(6,95,70)">Item</text>
  <text x="340" y="168" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(16,185,129)">« Audit énergétique » (id 12)</text>

  <!-- Box C: List page -->
  <rect x="40" y="268" width="280" height="70" rx="8" fill="rgb(243,244,246)" stroke="rgb(156,163,175)" stroke-width="0.5"/>
  <text x="180" y="295" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(75,85,99)">Page liste</text>
  <text x="180" y="316" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(156,163,175)">getContentModelItems('service')</text>

  <!-- Box D: Permalink -->
  <rect x="360" y="268" width="280" height="70" rx="8" fill="rgb(254,243,199)" stroke="rgb(234,88,12)" stroke-width="0.5"/>
  <text x="500" y="295" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(154,52,18)">Permalien /services</text>
  <text x="500" y="316" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(234,88,12)">content-id : service → page : service-details</text>

  <!-- Box E: Detail page -->
  <rect x="360" y="376" width="280" height="70" rx="8" fill="rgb(243,244,246)" stroke="rgb(156,163,175)" stroke-width="0.5"/>
  <text x="500" y="403" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(75,85,99)">Page détail</text>
  <text x="500" y="424" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(156,163,175)">useProps().contentModelItem</text>
</svg>

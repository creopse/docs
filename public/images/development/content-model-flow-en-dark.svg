<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Content model, items, and permalink</title>
  <desc>A "service" content model defines a structure. Its items (e.g. "Energy Audit") are rendered either by a list page through getContentModelItems, or individually by a detail page linked through a permalink that associates the content model with its detail page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; }
    .title { font-size: 14px; font-weight: 500; }
    .subtitle { font-size: 12px; font-weight: 400; }
  </style>

  <!-- Arrows -->
  <line x1="340" y1="84" x2="340" y2="122" stroke="rgba(222,220,209,0.35)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M340 188 Q260 230 180 266" fill="none" stroke="rgba(222,220,209,0.35)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M340 188 Q420 230 500 266" fill="none" stroke="rgba(222,220,209,0.35)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="500" y1="338" x2="500" y2="374" stroke="rgba(222,220,209,0.35)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Box A: Content model -->
  <rect x="200" y="20" width="280" height="64" rx="6" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="0.5"/>
  <text x="340" y="44" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(181,212,244)">Content Model</text>
  <text x="340" y="64" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(133,183,235)">service</text>

  <!-- Box B: Item -->
  <rect x="200" y="124" width="280" height="64" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
  <text x="340" y="148" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(159,225,203)">Item</text>
  <text x="340" y="168" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(93,202,165)">"Energy Audit" (id 12)</text>

  <!-- Box C: List page -->
  <rect x="40" y="268" width="280" height="70" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
  <text x="180" y="295" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(211,209,199)">List page</text>
  <text x="180" y="316" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(180,178,169)">getContentModelItems('service')</text>

  <!-- Box D: Permalink -->
  <rect x="360" y="268" width="280" height="70" rx="8" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
  <text x="500" y="295" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(245,196,179)">Permalink /services</text>
  <text x="500" y="316" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(240,153,123)">content-id: service → page: service-details</text>

  <!-- Box E: Detail page -->
  <rect x="360" y="376" width="280" height="70" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
  <text x="500" y="403" text-anchor="middle" dominant-baseline="central" class="title" fill="rgb(211,209,199)">Detail page</text>
  <text x="500" y="424" text-anchor="middle" dominant-baseline="central" class="subtitle" fill="rgb(180,178,169)">useProps().contentModelItem</text>
</svg>
